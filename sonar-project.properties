# Host URL and token are injected at runtime; never commit secrets.
sonar.projectKey=frac-studio-service
sonar.projectName=frac-studio-service

sonar.sources=src,tools
sonar.tests=src,tools,test
sonar.test.inclusions=**/*.test.ts,test/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**
sonar.coverage.exclusions=**/*.test.ts,test/**,src/server.ts,src/migrate.ts,tools/reports/run-*.ts,tools/ops/**,tools/fixtures/**,src/app.ts,src/config/**
